CONFIG_ZMK_POINTING=y
# Advertise HID wheel resolution multipliers for the central pointing device.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_MOUSE=y

# Extra headroom for dense HRM/combo/layer bursts.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=8
# Extra central receive headroom for split pointer/position bursts.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=16

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep after 60 minutes.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Enter regular idle after one minute while retaining responsive wake behavior.
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_PM_SOFT_OFF=y

# Toucan2's central status display and input processing requirements.
CONFIG_TOUCAN_STATUS_SCREEN=2
CONFIG_INPUT_THREAD_STACK_SIZE=2048
